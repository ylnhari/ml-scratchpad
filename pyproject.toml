[project]
name = "learning"
version = "0.1.0"
description = "Personal learning lab — algorithm implementations and visualizations"
requires-python = ">=3.11"
dependencies = []

# ── Subfolder dependency groups ──────────────────────────────────────────────
# Add a new group here when adding a new subfolder.
# Install all:     pip install -e ".[all]"
# Install one:     pip install -e ".[turbo-quant]"
[project.optional-dependencies]
turbo-quant = [
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "nbformat>=5.9",
    "nbconvert>=7",
    "jupyter>=1.0",
]
attention-transformer = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "nbformat>=5.9",
    "nbconvert>=7",
    "jupyter>=1.0",
]
nanogpt-from-scratch = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "nbformat>=5.9",
    "nbconvert>=7",
    "jupyter>=1.0",
]
kv-cache = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "nbformat>=5.9",
    "nbconvert>=7",
    "jupyter>=1.0",
]
rope = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "nbformat>=5.9",
    "nbconvert>=7",
    "jupyter>=1.0",
]
inference-engine = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "nbformat>=5.9",
    "nbconvert>=7",
    "jupyter>=1.0",
]
continuous-batching = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "nbformat>=5.9",
    "nbconvert>=7",
    "jupyter>=1.0",
]
all = [
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "nbformat>=5.9",
    "nbconvert>=7",
    "jupyter>=1.0",
]

[build-system]
requires      = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
